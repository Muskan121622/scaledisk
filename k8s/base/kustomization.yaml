apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scaledesk

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  - jaeger.yaml
  - configmap.yaml
  - secret.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: scaledesk
    includeSelectors: false
