# Postgres — single PrimaryReplica, mirroring docker-compose's `postgres` service.
# Only the `scaledesk` superuser is provisioned here (via the standard postgres image env);
# the least-privilege `scaledesk_app` role + grants are created by the app's own
# LeastPrivilegeAppRole migration over the PostgresMigrator connection — same as compose.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: scaledesk
            - name: POSTGRES_USER
              value: scaledesk
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scaledesk-secret
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scaledesk", "-d", "scaledesk"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "scaledesk", "-d", "scaledesk"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
