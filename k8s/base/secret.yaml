# DEV-ONLY manifest: values are the same well-known local credentials as docker-compose.yml,
# committed deliberately so `kubectl apply -k` works from a clean clone. For any real
# deployment, replace this file (sealed secret / external secret store / `kubectl create secret`).
apiVersion: v1
kind: Secret
metadata:
  name: scaledesk-secret
type: Opaque
stringData:
  # Jwt__SecretKey — HS256 signing key (>= 32 bytes).
  jwt-secret-key: "change-me-in-prod-this-is-a-dev-only-32byte-secret!!"
  # postgres StatefulSet superuser (POSTGRES_PASSWORD) == PostgresMigrator password above.
  postgres-password: "scaledesk"
