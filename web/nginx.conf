# Serves the built SPA and reverse-proxies API traffic to the `api` Service (k8s DNS).
# Same-origin layout mirrors the Vite dev proxy (vite.config.ts): /api, /hubs, /health.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived connections for SignalR (server-sent events / long polling fallback).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /api/ {
        proxy_pass http://api:8080;
    }

    # Websocket upgrade only for the hubs route; plain HTTP still works for the
    # SignalR negotiate + fallback transports.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # api container health endpoints, proxied for external probes/verification.
    location /health/ {
        proxy_pass http://api:8080;
    }

    # Hashed build assets are immutable; cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: client-side routes (/app, /portal, /platform) all serve index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
